<!-- scope: shared -->
<!doctype html>
<html lang="ta" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SwabodhiniCare</title>
<script src="js/theme-boot.js"></script>
<script src="shared/dates.js"></script>
<script src="shared/actions.js"></script>
<script src="shared/permissions.js"></script>
<script src="shared/workflow.js"></script>
<script src="shared/form-schema.js"></script>
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/pages/home.js"></script>
</head>
<body>
<div class="app">
  <header class="app-bar">
    <span class="wordmark">Swabodhini<b>Care</b></span>
    <button type="button" class="btn btn-outline btn-small" data-lang-toggle>தமிழ் / English</button>
  </header>
  <main class="screen">
    <div class="brand">
      <h1 id="greeting"></h1>
      <p class="muted" id="role-line"></p>
    </div>
    <p class="alert alert-bad" id="message" role="alert" hidden></p>
    <a class="btn btn-primary btn-block" id="new-application" href="application.html" data-i18n="home.newApplication" hidden>Start a new application</a>

    <section class="queue" aria-labelledby="queue-title">
      <div class="queue-head">
        <h2 id="queue-title" data-i18n="queue.title">My Queue</h2>
        <button type="button" class="btn btn-outline btn-small" id="refresh" data-i18n="common.refresh">Refresh</button>
      </div>
      <div class="queue-hero">
        <div class="queue-num" id="queue-count"></div>
        <p class="queue-label" id="queue-state"></p>
      </div>
      <p class="muted" id="list-empty" data-i18n="home.noneYet" hidden>No applications yet.</p>
      <ul class="app-list" id="app-list"></ul>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="Main">
    <a href="home.html" aria-current="page" data-i18n="nav.home">Home</a>
    <a href="settings.html" data-i18n="nav.settings">Settings</a>
  </nav>
</div>
</body>
</html>
