<!-- scope: shared -->
<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · SwabodhiniCare</title>
<style>
  :root { --paper: #EEF3F1; --ink: #16252D; --ink-2: #4A5B63; --primary: #0F5C6E; --surface: #FFFFFF; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: "Noto Sans Tamil", system-ui, sans-serif; padding: 16px; }
  .card { background: var(--surface); border-radius: 16px; padding: 32px 24px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 4px 24px rgba(22, 37, 45, .08); }
  h1 { font-size: 1.35rem; margin: 0 0 12px; line-height: 1.4; }
  h1 span { display: block; font-size: 1.1rem; }
  p { color: var(--ink-2); margin: 0 0 24px; line-height: 1.6; }
  p span { display: block; }
  a { display: inline-block; background: var(--primary); color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 12px; font-weight: 600; }
</style>
</head>
<body>
  <main class="card" role="alert">
    <h1>You're offline<span lang="ta">நீங்கள் ஆஃப்லைனில் உள்ளீர்கள்</span></h1>
    <p>Check your connection and try again.<span lang="ta">இணைப்பைச் சரிபார்த்து மீண்டும் முயற்சிக்கவும்.</span></p>
    <a href="/">Try again · மீண்டும் முயற்சி</a>
  </main>
</body>
</html>
