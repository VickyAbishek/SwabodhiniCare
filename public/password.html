<!-- scope: shared -->
<!doctype html>
<html lang="ta" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SwabodhiniCare</title>
<script src="js/theme-boot.js"></script>
<script src="shared/actions.js"></script>
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/pages/password.js"></script>
</head>
<body>
<div class="app">
  <header class="app-bar">
    <span class="wordmark">Swabodhini<b>Care</b></span>
    <button type="button" class="btn btn-outline btn-small" data-lang-toggle>தமிழ் / English</button>
  </header>
  <main class="screen">
    <h1 data-i18n="password.title">Choose your own password</h1>
    <p class="muted" id="intro" data-i18n="password.intro">Choose a new password that only you know.</p>

    <form id="password-form" novalidate>
      <div class="field">
        <label for="current" data-i18n="password.current">Current password</label>
        <div class="with-action">
          <input class="input" id="current" name="current" type="password" autocomplete="current-password" required>
          <button type="button" class="btn btn-outline btn-small" data-show-password="current" aria-pressed="false">
            <span data-i18n="common.show">Show</span>
          </button>
        </div>
        <p class="field-error" id="current-error" hidden></p>
      </div>
      <div class="field">
        <label for="password" data-i18n="password.new">New password</label>
        <div class="with-action">
          <input class="input" id="password" name="password" type="password" autocomplete="new-password" required>
          <button type="button" class="btn btn-outline btn-small" data-show-password="password" aria-pressed="false">
            <span data-i18n="common.show">Show</span>
          </button>
        </div>
        <p class="hint" data-i18n="password.hint">At least 8 letters or numbers.</p>
        <p class="field-error" id="password-error" hidden></p>
      </div>
      <div class="field">
        <label for="password2" data-i18n="password.again">Type it again</label>
        <input class="input" id="password2" name="password2" type="password" autocomplete="new-password" required>
        <p class="field-error" id="password2-error" hidden></p>
      </div>
      <p class="alert alert-bad" id="message" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary btn-block" id="submit" data-i18n="password.save">Save password</button>
    </form>
    <a class="link-btn" id="back" href="settings.html" data-i18n="common.back" hidden>Back</a>
  </main>
</div>
</body>
</html>
